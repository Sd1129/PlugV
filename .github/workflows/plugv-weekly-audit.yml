name: PlugV weekly launch-readiness audit

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: plugv-weekly-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:maintenance
      - name: Check official source links
        run: npm run audit:sources
      - name: Audit production dependencies
        run: npm run audit:security
      - name: Open or update the maintenance alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[PlugV maintenance] Automated check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 100 });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const body = `Weekly launch-readiness checks failed on ${new Date().toISOString()}. Review the run: ${runUrl}`;
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });

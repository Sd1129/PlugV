name: PlugV daily catalogue and live-site maintenance

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: plugv-daily-health
  cancel-in-progress: true

jobs:
  live-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check critical pages, SEO files, support address and security headers
        run: node scripts/site-health-audit.mjs
      - name: Ensure every officially verified launch is in Explore EVs
        run: node scripts/launched-catalog-audit.mjs
      - name: Verify current-year and next-year Upcoming catalogue
        run: node scripts/upcoming-catalog-audit.mjs
      - name: Check catalogue freshness
        run: node scripts/data-freshness-audit.mjs
      - name: Check Knowledge Hub coverage and review cadence
        run: node scripts/content-freshness-audit.mjs
      - name: Restore candidates already awaiting review
        run: |
          branch="automation/official-ev-candidates"
          if git fetch origin "$branch":refs/remotes/origin/"$branch" 2>/dev/null; then
            git show origin/"$branch":data/catalogue-candidates.json > data/catalogue-candidates.json || true
          fi
      - name: Discover unregistered EV links on official India manufacturer sites
        env:
          DISCOVERY_OUTPUT: data/catalogue-candidates.json
        run: node scripts/official-ev-discovery-monitor.mjs
      - name: Stage official EV discoveries in a review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/catalogue-candidates.json; then
            echo "No new official EV candidates."
            exit 0
          fi
          branch="automation/official-ev-candidates"
          git config user.name "plugv-operations-bot"
          git config user.email "support@plugv.in"
          git checkout -B "$branch"
          git add data/catalogue-candidates.json
          git commit -m "Stage official EV catalogue candidates"
          git push --force-with-lease origin "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create \
            --base main \
            --head "$branch" \
            --title "Review official EV catalogue candidates" \
            --body "Automated discovery found EV-related links on official India manufacturer websites. Verify India launch status, variant facts, dates and official evidence before promotion. This PR does not publish any vehicle to PlugV."
      - name: Open or update the maintenance alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[PlugV maintenance] Automated check failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 100 });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const body = `Daily PlugV catalogue or live-site maintenance checks failed on ${new Date().toISOString()}. Review the official-source, freshness, Upcoming, Explore EVs and live-site results: ${runUrl}`;
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });


    <path d="M280 156 224 250h52l-35 111 91-137h-55l43-68h-40Z" fill="url(#brand)"/>
    <path d="M160 374c0 22 18 40 40 40h50" fill="none" stroke="url(#brand)" stroke-width="30" stroke-linecap="round"/><path d="M272 392v42M310 392v42" stroke="#67E8F9" stroke-width="20" stroke-linecap="round"/>
  </g>
  <text x="380" y="206" font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif" font-size="154" font-weight="760" letter-spacing="-9" fill="#F8FAFC">Plug<tspan fill="url(#v)">V</tspan></text>
  <text x="390" y="268" font-family="Inter, Avenir Next, Segoe UI, Arial, sans-serif" font-size="27" font-weight="650" letter-spacing="8" fill="#94A3B8">INDIA'S EV PLATFORM</text>

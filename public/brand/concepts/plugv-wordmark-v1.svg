<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">PlugV concept wordmark</title>
  <desc id="desc">PlugV icon alongside a prominent PlugV name and India's EV platform descriptor.</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="16" x2="324" y2="344" gradientUnits="userSpaceOnUse"><stop stop-color="#0B2338"/><stop offset="1" stop-color="#020817"/></linearGradient>
    <linearGradient id="brand" x1="80" y1="58" x2="286" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#67E8F9"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <linearGradient id="v" x1="870" y1="80" x2="1020" y2="270" gradientUnits="userSpaceOnUse"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#34D399"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="48" fill="#020817"/>
  <g transform="translate(38 32) scale(.58)">

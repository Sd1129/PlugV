<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">PlugV concept icon</title>
  <desc id="desc">A premium rounded icon containing a stylised P, charging cable and electric bolt.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="40" x2="452" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2338"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="brand" x1="126" y1="100" x2="390" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#38BDF8"/>

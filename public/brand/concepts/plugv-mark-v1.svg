  <path d="M280 156 224 250h52l-35 111 91-137h-55l43-68h-40Z" fill="url(#brand)" filter="url(#glow)"/>
  <path d="M160 374c0 22 18 40 40 40h50" fill="none" stroke="url(#brand)" stroke-width="30" stroke-linecap="round"/>
  <path d="M272 392v42M310 392v42" stroke="#67E8F9" stroke-width="20" stroke-linecap="round"/>
